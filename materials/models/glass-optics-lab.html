<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стакан — сцена слайдера</title>
  <style>
    html, body, #app { width: 100%; height: 100%; margin: 0; }
    body { overflow: auto; }
    .lab-scene {
      position: relative;
      isolation: isolate;
      width: var(--scene-width);
      height: var(--scene-height);
      overflow: hidden;
      background: #fff;
    }
    .lab-counter {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      width: 100%;
      height: 30%;
      object-fit: fill;
      pointer-events: none;
    }
    .lab-pattern {
      position: absolute;
      inset: 0 0 30%;
      z-index: 1;
      width: 100%;
      height: 70%;
      color: #3d5a45;
      opacity: 0.07;
      pointer-events: none;
    }
    /* Резервируем ту же геометрию верхней части и управления слайдера. */
    .lab-stage {
      position: absolute;
      inset: calc((6rem + clamp(1.75rem, 5vw, 4.5rem) + 2rem) * var(--zoom)) 0 calc(6.5rem * var(--zoom));
      z-index: 2;
    }
    .lab-stage.is-loading { opacity: 0; pointer-events: none; }
    .lab-loader { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; color: #3d5a45; font: 18px system-ui, sans-serif; pointer-events: none; }
    .lab-spinner { width: 44px; height: 44px; border: 3px solid rgb(61 90 69 / 0.18); border-top-color: #3d5a45; border-radius: 50%; animation: lab-spin 0.8s linear infinite; }
    @keyframes lab-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .lab-spinner { animation-duration: 2s; } }
    .product-model-shadows { position: absolute; z-index: 0; overflow: hidden; pointer-events: none; }
    .lab-stage article { position: relative; width: 100%; height: 100%; }
    .lab-model {
      position: absolute;
      left: 50%;
      bottom: calc(0.75rem * var(--zoom));
      height: min(91.666667%, calc(36rem * var(--zoom)));
      max-width: var(--scene-width);
      aspect-ratio: 1;
      transform: translateX(-50%);
    }
    .lab-model { z-index: 1; pointer-events: none; }
    .lab-hit { position: absolute; z-index: 2; pointer-events: auto; }
    .lab-model.lab-can {
      z-index: 0;
      left: calc(50% + 8rem * var(--zoom));
      bottom: calc(5rem * var(--zoom));
      height: min(91.666667%, calc(36rem * var(--zoom)));
    }
    .product-model {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .product-model-shadow {
      position: absolute;
      z-index: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse 42% 19% at 50% 43%, rgb(0 0 0 / 0.82) 0%, rgb(0 0 0 / 0.68) 40%, rgb(0 0 0 / 0.25) 72%, transparent 100%),
        radial-gradient(ellipse closest-side at center, rgb(0 0 0 / 0.2) 0%, rgb(0 0 0 / 0.12) 50%, rgb(0 0 0 / 0.04) 75%, transparent 100%);
    }
    .product-model canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }
    .lab-model canvas {
      transform-origin: var(--model-origin, 50% 90%);
      transition: rotate 500ms;
    }
    .lab-model.is-hovered canvas { rotate: var(--hover-angle); }
    .lab-zoom {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 10;
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 1px solid #3d5a45;
      border-radius: 0.75rem;
      background: #fff;
      color: #3d5a45;
      font: 16px system-ui, sans-serif;
    }
    .lab-zoom button {
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .lab-zoom button:hover:not(:disabled) { background: #efefef; }
    .lab-zoom button:focus-visible { outline: 2px solid #3d5a45; outline-offset: -2px; }
    .lab-zoom button:disabled { cursor: default; }
    @media (min-width: 80rem) {
      .lab-stage { top: calc((7rem + clamp(1.75rem, 5vw, 4.5rem) + 2.5rem) * var(--zoom)); }
    }
    @media (max-width: 53.999rem) {
      .lab-stage { top: calc(1rem * var(--zoom)); bottom: calc(2rem * var(--zoom)); }
      .lab-model { height: min(calc(var(--scene-height) * 0.85), var(--scene-width)); bottom: 0; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { createApp, defineComponent, h, nextTick, onBeforeUnmount, onMounted, ref, watch } from 'vue'
    import '../../src/styles/main.css'
    import CategoryPattern from '../../src/components/CategoryPattern.vue'
    import barCounterTexture from '../../src/assets/home/bar-counter-texture.png'
    import glassModelUrl from '../../src/assets/models/glass.glb?url'
    import canModelUrl from '../../src/assets/models/can.glb?url'

    // Трассировка одобренного прототипа: реальные пересечения наружной и внутренней
    // стенок, бортика, дна и напитка. Фон считывается из текущего слайда.
    // Профиль восстанавливается по рёбрам реальной сетки, а не по порядку вершин GLB.
    function profile(THREE, mesh) {
      const position = mesh.geometry.attributes.position
      const normal = mesh.geometry.attributes.normal
      const index = mesh.geometry.index
      const points = [], ids = [], edges = []
      for (let i = 0; i < position.count; i++) {
        const x = position.getX(i), y = position.getY(i), z = position.getZ(i)
        const r = Math.hypot(x, z)
        let id = points.findIndex(p => Math.abs(p.r - r) < 0.000002 && Math.abs(p.y - y) < 0.000002)
        if (id < 0) { id = points.length; points.push({ r, y, nr: 0, ny: 0, count: 0 }); edges.push(new Set()) }
        const p = points[id]
        p.nr += r > 0.000001 ? (normal.getX(i) * x + normal.getZ(i) * z) / r : 0
        p.ny += normal.getY(i); p.count++
        ids.push(id)
      }
      for (let i = 0; i < index.count; i += 3) {
        const triangle = [...new Set([ids[index.getX(i)], ids[index.getX(i + 1)], ids[index.getX(i + 2)]])]
        if (triangle.length === 2) { edges[triangle[0]].add(triangle[1]); edges[triangle[1]].add(triangle[0]) }
      }
      const start = edges.findIndex(e => e.size === 1)
      if (start < 0 || edges.some(e => e.size > 2)) throw new Error('Профиль сетки неоднозначен')
      const chain = []
      let current = start, previous = -1
      while (current !== undefined) {
        chain.push(points[current])
        const next = [...edges[current]].find(id => id !== previous)
        previous = current; current = next
      }
      if (chain.length !== points.length) throw new Error('Профиль не замкнут по сетке')
      for (const point of points) {
        if (point.r < 0.000001 && Math.hypot(point.nr, point.ny) / point.count < 0.5) {
          const cap = points.find(p => p.r > 0.000001 && Math.abs(p.y - point.y) < 0.000002 && Math.abs(p.ny) > 0.01)
          if (!cap) throw new Error('Не определена нормаль центральной вершины')
          point.ny = Math.sign(cap.ny) * point.count
        }
      }
      return chain.map(p => new THREE.Vector4(p.r * 10, (p.y - 0.0014) * 10, p.nr / p.count, p.ny / p.count))
    }
    
    function opticalNormals(points) {
      const angles = points.map(point => Math.atan2(point.w, point.z))
      const difference = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a))
      return points.map((point, i) => {
        let slope = 0
        if (i > 0 && i < points.length - 1) {
          const left = point.y - points[i - 1].y, right = points[i + 1].y - point.y
          if (Math.abs(left) >= 0.000001 && Math.abs(right) >= 0.000001 && left * right > 0) {
            const a = difference(angles[i - 1], angles[i]) / left
            const b = difference(angles[i], angles[i + 1]) / right
            if (a * b > 0) {
              const wa = 2 * Math.abs(right) + Math.abs(left)
              const wb = Math.abs(right) + 2 * Math.abs(left)
              const mean = (wa + wb) / (wa / a + wb / b)
              slope = Math.sign(mean) * Math.min(Math.abs(mean), 1.5 * Math.abs(a), 1.5 * Math.abs(b))
            }
          }
        }
        return { angle: angles[i], slope }
      })
    }

    // Исходные сегменты в дереве границ; геометрия не упрощается.
    function profileTree(THREE, glass, liquid) {
      const glassNormals = opticalNormals(glass), liquidNormals = opticalNormals(liquid)
      // Смоченная стенка — одна граница двух сред. У обеих сторон должны
      // совпадать не только позиции, но и производные оптических нормалей.
      liquid.forEach((point, i) => {
        const shared = glass.findIndex(other => Math.abs(other.x - point.x) < 1e-8 && Math.abs(other.y - point.y) < 1e-8 && other.z * point.z + other.w * point.w < 0)
        if (shared >= 0) {
          liquidNormals[i] = { angle: Math.atan2(-glass[shared].w, -glass[shared].z), slope: glassNormals[shared].slope }
          return
        }
        // У уровня напитка сегмент стенки обрезан. Нормаль и её производная
        // здесь берутся из того же поля, а не пересчитываются по мениску.
        for (let j = 0; j < glass.length - 1; j++) {
          const a = glass[j], b = glass[j + 1], dy = b.y - a.y
          if (Math.abs(dy) < 0.000001) continue
          const u = (point.y - a.y) / dy
          if (u <= 0 || u >= 1 || Math.abs(point.x - (a.x + u * (b.x - a.x))) >= 1e-8 || a.z * point.z + a.w * point.w >= 0) continue
          const na = glassNormals[j], nb = glassNormals[j + 1], u2 = u * u, u3 = u2 * u
          const delta = Math.atan2(Math.sin(nb.angle - na.angle), Math.cos(nb.angle - na.angle))
          const angle = na.angle + (-2 * u3 + 3 * u2) * delta + (u3 - 2 * u2 + u) * dy * na.slope + (u3 - u2) * dy * nb.slope
          const slope = (-6 * u2 + 6 * u) * delta / dy + (3 * u2 - 4 * u + 1) * na.slope + (3 * u2 - 2 * u) * nb.slope
          liquidNormals[i] = { angle: Math.atan2(-Math.sin(angle), -Math.cos(angle)), slope }
          break
        }
      })
      const segments = []
      for (const [points, normals, object] of [[glass, glassNormals, 1], [liquid, liquidNormals, 2]]) {
        for (let i = 0; i < points.length; i++) {
          const a = points[i], b = points[(i + 1) % points.length]
          // segment() допускает выход на 1e-6 по высоте. У почти плоского
          // кольца этому соответствует заметный радиальный запас.
          const dy = Math.abs(b.y - a.y)
          const radialMargin = 0.000002 * (1 + (dy >= 0.000001 ? Math.abs(b.x - a.x) / dy : 0))
          segments.push({ a, b, normalA: normals[i], normalB: normals[(i + 1) % points.length], object, closing: i === points.length - 1, radialMargin })
        }
      }
      const nodes = []
      function append(items) {
        const node = {
          minY: Math.min(...items.map(({ a, b }) => Math.min(a.y, b.y))) - 0.000002,
          maxY: Math.max(...items.map(({ a, b }) => Math.max(a.y, b.y))) + 0.000002,
          minR: Math.max(0, Math.min(...items.map(({ a, b, radialMargin }) => Math.min(a.x, b.x) - radialMargin))),
          maxR: Math.max(...items.map(({ a, b, radialMargin }) => Math.max(a.x, b.x) + radialMargin)),
          object: items.every(item => item.object === items[0].object) ? items[0].object : 0,
          leaf: items.length === 1,
        }
        nodes.push(node)
        if (node.leaf) Object.assign(node, items[0])
        else {
          const sorted = items.slice().sort((a, b) => (a.a.y + a.b.y) - (b.a.y + b.b.y))
          const middle = Math.floor(sorted.length / 2)
          append(sorted.slice(0, middle))
          append(sorted.slice(middle))
        }
        node.escape = nodes.length
      }
      append(segments)
      const data = new Float32Array(nodes.length * 16)
      nodes.forEach((node, index) => {
        const offset = index * 16
        // Запас на округление Float32 и касательные лучи.
        data.set([node.minY, node.maxY, node.minR, node.maxR], offset)
        data.set([node.escape, node.object, Number(node.leaf), Number(Boolean(node.closing))], offset + 4)
        if (node.leaf) {
          data.set([node.a.x, node.a.y, node.normalA.angle, node.normalA.slope], offset + 8)
          data.set([node.b.x, node.b.y, node.normalB.angle, node.normalB.slope], offset + 12)
        }
      })
      const texture = new THREE.DataTexture(data, 4, nodes.length, THREE.RGBAFormat, THREE.FloatType)
      texture.needsUpdate = true
      return { texture, count: nodes.length }
    }
    
    // Оптика банки использует её объём и развёртку этикетки, а не снимок фона.
    let bankOptics = null
    function createBankSurface(THREE, product, bounds) {
      const canvas = document.createElement('canvas')
      canvas.width = 1024; canvas.height = 1024
      const context = canvas.getContext('2d')
      const center = bounds.getCenter(new THREE.Vector3())
      const height = bounds.max.y - bounds.min.y
      product.updateMatrixWorld(true)
      let radius = 0
      product.traverse(mesh => {
        if (!mesh.isMesh) return
        const position = mesh.geometry.attributes.position
        for (let i = 0; i < position.count; i++) {
          const point = new THREE.Vector3().fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld)
          radius = Math.max(radius, Math.hypot(point.x - center.x, point.z - center.z))
        }
      })
      product.traverse(mesh => {
        if (!mesh.isMesh || mesh.material?.name !== 'marion-printed-label') return
        const source = mesh.material.map?.image
        if (!source) throw new Error('Не найдена текстура этикетки')
        const pos = mesh.geometry.attributes.position, uv = mesh.geometry.attributes.uv, index = mesh.geometry.index
        const count = index?.count ?? pos.count
        for (let i = 0; i < count; i += 3) {
          const vertices = [0, 1, 2].map(k => {
            const id = index ? index.getX(i + k) : i + k
            const point = new THREE.Vector3().fromBufferAttribute(pos, id).applyMatrix4(mesh.matrixWorld)
            return { x: (Math.atan2(point.z - center.z, point.x - center.x) / (2 * Math.PI) + 0.5) * canvas.width,
              y: (bounds.max.y - point.y) / height * canvas.height,
              u: uv.getX(id) * source.width, v: uv.getY(id) * source.height }
          })
          if (Math.max(...vertices.map(p => p.x)) - Math.min(...vertices.map(p => p.x)) > canvas.width / 2) {
            for (const vertex of vertices) if (vertex.x < canvas.width / 2) vertex.x += canvas.width
          }
          const [a, b, c] = vertices
          const du1 = b.u - a.u, dv1 = b.v - a.v, du2 = c.u - a.u, dv2 = c.v - a.v
          const det = du1 * dv2 - du2 * dv1
          if (Math.abs(det) < 1e-8) continue
          const aa = ((b.x - a.x) * dv2 - (c.x - a.x) * dv1) / det
          const bb = ((b.y - a.y) * dv2 - (c.y - a.y) * dv1) / det
          const cc = ((c.x - a.x) * du1 - (b.x - a.x) * du2) / det
          const dd = ((c.y - a.y) * du1 - (b.y - a.y) * du2) / det
          for (const shift of [0, -canvas.width]) {
            context.save()
            context.beginPath(); context.moveTo(a.x + shift, a.y); context.lineTo(b.x + shift, b.y); context.lineTo(c.x + shift, c.y); context.closePath(); context.clip()
            context.setTransform(aa, bb, cc, dd, a.x + shift - aa * a.u - cc * a.v, a.y - bb * a.u - dd * a.v)
            context.drawImage(source, 0, 0)
            context.restore()
          }
        }
      })
      return { canvas, height, radius }
    }

    function fittedLiquidProfile(THREE, glass, liquid) {
      const rim = glass.reduce((best, point, i) => point.y > glass[best].y ? i : best, 0)
      const inner = glass.slice(rim + 1).reverse()
      const level = liquid.at(-1).y
      const surfaceStart = liquid.findIndex(point => point.y > level - 0.02 && point.w > 0.5)
      if (surfaceStart < 0) throw new Error('Не найден мениск напитка')
      const surface = liquid.slice(surfaceStart)
      const contactY = surface[0].y
      const fitted = []
      for (let i = 0; i < inner.length - 1; i++) {
        const a = inner[i], b = inner[i + 1]
        if (a.y > contactY) break
        fitted.push(new THREE.Vector4(a.x, a.y, -a.z, -a.w))
        if (a.y <= contactY && b.y > contactY) {
          const t = (contactY - a.y) / (b.y - a.y)
          fitted.push(new THREE.Vector4(THREE.MathUtils.lerp(a.x, b.x, t), contactY, -THREE.MathUtils.lerp(a.z, b.z, t), -THREE.MathUtils.lerp(a.w, b.w, t)))
          break
        }
      }
      if (fitted.length < 3) throw new Error('Не определён контакт напитка со стеклом')
      return [...fitted, ...surface]
    }

    const sceneSettings = { camera: [0, 0.88, 5], light: [-1.8, 2.5, 1.2] }

    async function createGlassRenderer(THREE, renderer, scene, camera, element, onBackgroundReady, isActive, onFrameReady, onRenderError) {
      let glass, liquid
      scene.traverse(node => {
        if (node.material?.name === 'clear-glass') glass = node
        if (node.material?.name === 'golden-mead') liquid = node
      })
      if (!glass || !liquid) throw new Error('Glass and liquid volumes are required')
      const glassProfile = profile(THREE, glass)
      const liquidProfile = fittedLiquidProfile(THREE, glassProfile, profile(THREE, liquid))
      const tree = profileTree(THREE, glassProfile, liquidProfile)
      const section = element.closest('section')
      const article = element.closest('article')
      const slideIndex = Array.from(article.parentElement.children).indexOf(article)
      const pattern = Array.from(section.querySelectorAll('svg')).filter(svg => svg.querySelector('pattern'))[slideIndex]
      const counter = section.querySelector(':scope > img[aria-hidden="true"]')
      const canvas = document.createElement('canvas')
      const context = canvas.getContext('2d')
      if (!context) throw new Error('Could not create the refraction backdrop')
      const backdropTexture = new THREE.CanvasTexture(canvas)
      const dimensions = new THREE.Vector2(1, 1)
      let patternImage, patternSize = '', backdropPosition = '', patternVersion = 0, backgroundVersion = 0
      let requestVersion = 0, disposed = false, dirty = true
      let frame = 0, tile = 0, complete = false, tiles = []
      let pendingResize = true, fence = null, displayPending = false, failed = false
      let stableSignature = '', stableSince = 0
      const gl = renderer.getContext()
      scene.updateMatrixWorld(true)
      const modelScale = glass.getWorldScale(new THREE.Vector3()).x
      const modelOrigin = glass.getWorldPosition(new THREE.Vector3())
      modelOrigin.y += 0.0014 * modelScale
      const labToWorld = new THREE.Matrix4().compose(modelOrigin, new THREE.Quaternion(), new THREE.Vector3().setScalar(modelScale / 10))
      const worldToLab = labToWorld.clone().invert()
      const bankTexture = new THREE.CanvasTexture(bankOptics?.canvas ?? document.createElement('canvas'))
      bankTexture.wrapS = THREE.RepeatWrapping
      const bankCenter = new THREE.Vector3(), bankSize = new THREE.Vector3()
      const bankInverse = new THREE.Matrix4()
      function updateBankGeometry() {
        const bank = section.querySelector('[data-lab-can]')
        if (!bank || !bankOptics) { bankSize.set(0, 0, 0); return }
        if (bankTexture.image !== bankOptics.canvas) { bankTexture.image = bankOptics.canvas; bankTexture.needsUpdate = true }
        const bankRect = bank.getBoundingClientRect(), rect = element.getBoundingClientRect()
        const factor = bankRect.width / rect.width
        const base = new THREE.Vector3(0, -bankOptics.height / 2, 0).project(camera)
        const screenX = bankRect.left + (base.x + 1) * bankRect.width / 2
        const screenY = bankRect.top + (1 - base.y) * bankRect.height / 2
        const origin = new THREE.Vector3((screenX - rect.left) / rect.width * 2 - 1, 1 - (screenY - rect.top) / rect.height * 2, -1).unproject(camera).applyMatrix4(worldToLab)
        const direction = new THREE.Vector3(0, 0, -1).transformDirection(camera.matrixWorld)
        const ground = origin.addScaledVector(direction, -origin.y / direction.y)
        const scale = factor * 10 / modelScale
        bankSize.set(bankOptics.radius * scale, bankOptics.height * scale / 2, bankOptics.radius * scale)
        bankCenter.copy(ground).add(new THREE.Vector3(0, bankSize.y, 0))
        const rotate = getComputedStyle(bank.querySelector('canvas')).rotate
        const angle = rotate === 'none' ? 0 : parseFloat(rotate) * Math.PI / 180
        const transform = new THREE.Matrix4().makeTranslation(...ground.toArray())
          .multiply(new THREE.Matrix4().makeRotationAxis(direction, angle))
          .multiply(new THREE.Matrix4().makeTranslation(0, bankSize.y, 0))
        bankInverse.copy(transform).invert()
      }
    
      if (!renderer.extensions.has('EXT_color_buffer_float') || gl.getParameter(gl.MAX_DRAW_BUFFERS) < 7) {
        tree.texture.dispose()
        backdropTexture.dispose()
        throw new Error('Floating-point ray state buffers are not supported')
      }
      const workWidth = 256
      const uniforms = {
        wallDepth: { value: -2 },
        bankTexture: { value: bankTexture }, bankSize: { value: bankSize }, bankInverse: { value: bankInverse },
        profileTree: { value: tree.texture }, treeCount: { value: tree.count },
        hasLiquid: { value: true }, perspective: { value: camera.isPerspectiveCamera },
        keyLight: { value: new THREE.Vector3(...sceneSettings.light).add(new THREE.Vector3(0, 0.9, 0)) },
        resolution: { value: dimensions }, backdropTexture: { value: backdropTexture },
        backdropScale: { value: new THREE.Vector2(1, 1) }, backdropOffset: { value: new THREE.Vector2() },
        labProjection: { value: new THREE.Matrix4() }, halfSize: { value: new THREE.Vector2() },
        rayOrigin: { value: new THREE.Vector3() }, rayRight: { value: new THREE.Vector3() },
        rayUp: { value: new THREE.Vector3() }, rayDirection: { value: new THREE.Vector3() },
        tileOffset: { value: new THREE.Vector2() }, tileSize: { value: new THREE.Vector2() },
        sampleCount: { value: 2 }, workWidth: { value: workWidth }, detailedBase: { value: false },
        state0: { value: null }, state1: { value: null }, state2: { value: null },
        state3: { value: null }, state4: { value: null }, state5: { value: null }, state6: { value: null },
      }
      const vertex = 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}'
      const optics = /* glsl */ `    precision highp float;
        uniform sampler2D profileTree;
        uniform int treeCount;
        uniform bool hasLiquid, perspective;
        uniform vec2 resolution;
        uniform sampler2D backdropTexture;
        uniform mat4 labProjection;
        uniform vec3 rayOrigin, rayRight, rayUp, rayDirection;
        uniform vec2 halfSize, backdropScale, backdropOffset;

            const camera = new THREE.OrthographicCamera(-1.28, 1.28, 1.28, -1.28, 0.1, 20)
            camera.position.set(...sceneSettings.camera)
            camera.lookAt(0, 0, 0)
            const draw = () => glassRenderer ? glassRenderer.render() : renderer.render(scene, camera)
            const canAnimate = () => !disposed && !unmounted && visible && props.active && !document.hidden
              && !glassRenderer && !props.paused && !motion.matches
            const animate = (time) => {
              frame = 0
              if (!canAnimate()) {
                lastTime = null
                return
              }
              if (!glassRenderer && lastTime !== null) {
                const elapsed = Math.min(time - lastTime, 100)
                product.rotation.y = (product.rotation.y + elapsed * Math.PI / 10000) % (Math.PI * 2)
              }
              lastTime = time
              draw()
              frame = requestAnimationFrame(animate)
            }
            function sync() {
              cancelAnimationFrame(frame)
              frame = 0
              lastTime = null
              if (glassRenderer && nearSection && !document.hidden && !disposed) draw()
              else if (canAnimate()) frame = requestAnimationFrame(animate)
            }
            syncAnimation = sync
            motion.addEventListener('change', sync)
            document.addEventListener('visibilitychange', sync)
            const render = () => {
              if (disposed || unmounted || !host.value) return
              const { width, height } = host.value.getBoundingClientRect()
              if (width <= 0 || height <= 0) return
              const pixelRatio = hasGlass
                ? Math.min(window.devicePixelRatio, 1.5, 720 / Math.max(width, height))
                : Math.min(window.devicePixelRatio, 1.5, 720 / Math.max(width, height))
              const sizeSignature = `${width}:${height}:${pixelRatio}`
              if (sizeSignature === renderedSize) { sync(); return }
              renderedSize = sizeSignature
              const aspect = width / height
              ready.value = false
              const halfHeight = 1.28 / Math.min(aspect, 1)
              camera.left = -halfHeight * aspect
              camera.right = halfHeight * aspect
              camera.top = halfHeight
              camera.bottom = -halfHeight
              camera.updateProjectionMatrix()
              // Оптика рисует отдельной камерой и обновляет исходную позже.
              // Проекция тени уже сейчас должна учитывать наклон этой камеры.
              camera.updateMatrixWorld(true)
              renderer.setPixelRatio(pixelRatio)
              renderer.setSize(width, height, false)
              glassRenderer?.resize()
              draw()
              // Keep the compact oval attached to the projected base at every size.
              const base = new THREE.Vector3(0, productBounds.min.y, 0).project(camera)
              const baseX = (base.x + 1) * width / 2
              const baseY = (1 - base.y) * height / 2
              host.value.style.setProperty('--model-origin', `${baseX}px ${baseY}px`)
              const projected = []
              for (const x of [productBounds.min.x, productBounds.max.x]) for (const y of [productBounds.min.y, productBounds.max.y]) for (const z of [productBounds.min.z, productBounds.max.z]) {
                const point = new THREE.Vector3(x, y, z).project(camera)
                projected.push({ x: (point.x + 1) * width / 2, y: (1 - point.y) * height / 2 })
              }
              const hitLeft = Math.min(...projected.map(p => p.x)), hitTop = Math.min(...projected.map(p => p.y))
              hitStyle.value = { left: `${hitLeft}px`, top: `${hitTop}px`, width: `${Math.max(...projected.map(p => p.x)) - hitLeft}px`, height: `${Math.max(...projected.map(p => p.y)) - hitTop}px` }
              const modelRect = host.value.getBoundingClientRect()
              const counterRect = host.value.closest('section').querySelector('.lab-counter').getBoundingClientRect()
              const shadowOffsetX = modelRect.left - counterRect.left, shadowOffsetY = modelRect.top - counterRect.top
              // Тень стакана остаётся в координатах модели; стойка задаёт только
              // область отсечения, а не новое начало координат для обеих теней.
              shadowClipStyle.value = hasGlass ? {
                left: '0', top: '0', width: '100%', height: '100%', overflow: 'visible',
                clipPath: `inset(${counterRect.top - modelRect.top}px ${modelRect.right - counterRect.right}px ${modelRect.bottom - counterRect.bottom}px ${counterRect.left - modelRect.left}px)`,
              } : { left: `${-shadowOffsetX}px`, top: `${-shadowOffsetY}px`, width: `${counterRect.width}px`, height: `${counterRect.height}px` }
              const shadowOriginX = hasGlass ? 0 : shadowOffsetX
              const shadowOriginY = hasGlass ? 0 : shadowOffsetY
              const projectionWidth = camera.right - camera.left
              const shadowWidth = baseWidth / projectionWidth * width
              const heightWorld = productBounds.max.y - productBounds.min.y
              const [lx, ly, lz] = sceneSettings.light
              const tip = new THREE.Vector3(-lx / ly * heightWorld, productBounds.min.y, -lz / ly * heightWorld).project(camera)
              const dx = (tip.x - base.x) * width / 2
              const dy = (base.y - tip.y) * height / 2
              const length = Math.hypot(dx, dy)
              shadowStyle.value = {
                left: `${baseX + dx / 2 + shadowOriginX}px`, top: `${baseY + dy / 2 + shadowOriginY}px`,
                width: `${length + shadowWidth}px`, height: `${shadowWidth * 0.35}px`,
                transform: `translate(-50%, -50%) rotate(${Math.atan2(dy, dx)}rad)`,
                background: 'radial-gradient(ellipse closest-side, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.25) 60%, transparent)',
              }
              contactStyle.value = {
                left: `${baseX + shadowOriginX}px`, top: `${baseY + shadowWidth * 0.025 + shadowOriginY}px`,
                width: `${shadowWidth * 1.65}px`, height: `${shadowWidth * 0.25}px`,
                background: 'radial-gradient(ellipse closest-side, rgb(0 0 0 / 0.82), rgb(0 0 0 / 0.42) 45%, transparent)',
              }
              if (!glassRenderer) {
                ready.value = true
                if (props.bank) void nextTick(() => {
                  if (!disposed && !unmounted) host.value?.closest('section')?.dispatchEvent(new Event('lab-can-ready'))
                })
              }
              sync()
            }
            if (hasGlass) {
              renderer.toneMapping = THREE.NoToneMapping
              glassRenderer = await createGlassRenderer(THREE, renderer, scene, camera, host.value, () => {
                if (!disposed && !unmounted) sync()
              }, () => !disposed && !unmounted && nearSection && !document.hidden && modelReady.value.can,
              () => { if (!disposed && !unmounted) ready.value = true },
              () => { ready.value = false; emit('error', 'Не удалось отрисовать стакан. Обновите страницу.'); dispose() })
              if (disposed || unmounted) {
                glassRenderer.dispose()
                return
              }
            }
            host.value.appendChild(renderer.domElement)
            resize = new ResizeObserver(render)
            resize.observe(host.value)
            render()
            sync()
          } catch (error) {
            emit('error', 'Не удалось загрузить модели. Обновите страницу.')
            console.error('Лаборатория: модель не загружена', error)
            ready.value = false
            dispose()
          }
        }
        
        onMounted(() => {
          intersection = new IntersectionObserver(([entry]) => {
            visible = entry.isIntersecting
            loadModel()
            syncAnimation()
          })
          intersection.observe(host.value)
          // Готовим соседний слайд заранее; анимация банки по-прежнему требует видимости.
          preparation = new IntersectionObserver(([entry]) => {
            nearSection = entry.isIntersecting
            loadModel()
            syncAnimation()
          }, { rootMargin: '100% 0px' })
          preparation.observe(host.value.closest('section') ?? host.value)
        })
        
        watch(() => [props.active, props.paused], () => {
          loadModel()
          syncAnimation()
        })
        
        onBeforeUnmount(() => {
          unmounted = true
          intersection?.disconnect()
          preparation?.disconnect()
          dispose()
        })
        
        return () => h('span', { ref: host, class: 'product-model', 'aria-hidden': 'true' }, [
          h('span', { class: 'lab-hit', style: { ...hitStyle.value, display: ready.value ? undefined : 'none' } }),
          h('span', { class: 'product-model-shadows', style: { ...shadowClipStyle.value, display: ready.value ? undefined : 'none' } }, [
            h('span', { class: 'product-model-shadow', style: contactStyle.value }),
            h('span', { class: 'product-model-shadow', style: shadowStyle.value }),
          ]),
        ])
      },
    })

    const hovered = ref(false)
    const canHovered = ref(false)
    const canHoverAngle = ref(3)
    const modelReady = ref({ glass: false, can: false })
    const loadingError = ref('')
    const bothReady = () => modelReady.value.glass && modelReady.value.can
    const readyHandler = kind => value => { modelReady.value[kind] = value }
    const hoverAngle = ref(3)
    const zoom = ref(1)
    const viewport = ref({ width: window.innerWidth, height: window.innerHeight })
    const updateViewport = () => {
      viewport.value = { width: window.innerWidth, height: window.innerHeight }
    }
    async function setZoom(value) {
      resetHover()
      zoom.value = Math.max(0.5, Math.min(4, value))
      if (zoom.value === 1) {
        await nextTick()
        window.scrollTo(0, 0)
      }
    }
    function updateHover(event) {
      if (event.pointerType === 'touch') return
      hovered.value = true
      const bounds = event.currentTarget.getBoundingClientRect()
      hoverAngle.value = event.clientX < bounds.left + bounds.width / 2 ? 3 : -3
    }
    function resetHover() {
      hovered.value = false
      canHovered.value = false
      hoverAngle.value = 3
    }

    const app = createApp({
      render: () => h('div', [
        h('div', { class: 'lab-zoom', role: 'group', 'aria-label': 'Масштаб страницы' }, [
          h('button', { type: 'button', 'aria-label': 'Уменьшить масштаб', disabled: zoom.value <= 0.5, onClick: () => setZoom(zoom.value - 0.25) }, '−'),
          h('button', { type: 'button', 'aria-label': 'Сбросить масштаб до 100%', onClick: () => setZoom(1) }, `${Math.round(zoom.value * 100)}%`),
          h('button', { type: 'button', 'aria-label': 'Увеличить масштаб', disabled: zoom.value >= 4, onClick: () => setZoom(zoom.value + 0.25) }, '+'),
        ]),
        h('section', {
          class: 'lab-scene', 'aria-label': 'Стакан на стойке',
          style: {
            '--zoom': zoom.value,
            '--scene-width': `${viewport.value.width * zoom.value}px`,
            '--scene-height': `${viewport.value.height * zoom.value}px`,
          },
        }, [
        h('img', { class: 'lab-counter', src: barCounterTexture, alt: '', 'aria-hidden': 'true' }),
        h(CategoryPattern, { class: 'lab-pattern', slug: 'sidr', idPrefix: 'glass-lab', viewBox: `0 0 ${viewport.value.width} ${viewport.value.height * 0.7}` }),
        !bothReady() && h('div', { class: 'lab-loader', role: 'status', 'aria-label': loadingError.value || 'Загрузка моделей', 'aria-live': 'polite' }, loadingError.value || h('span', { class: 'lab-spinner', 'aria-hidden': 'true' })),
        h('div', { class: ['lab-stage', { 'is-loading': !bothReady() }] }, [
          h('article', { 'aria-label': 'Стакан и банка на стойке' }, [
            h('div', { class: ['lab-model lab-can', { 'is-hovered': canHovered.value }], 'data-lab-can': '',
              style: { '--hover-angle': `${canHoverAngle.value}deg` },
              onPointerenter: event => { if (event.pointerType !== 'touch') canHovered.value = true },
              onPointermove: event => { if (event.pointerType !== 'touch') { canHovered.value = true; const rect = event.currentTarget.getBoundingClientRect(); canHoverAngle.value = event.clientX < rect.left + rect.width / 2 ? 3 : -3 } },
              onPointerleave: () => { canHovered.value = false }, onPointercancel: () => { canHovered.value = false },
            }, [
              h(LabProductModel, { source: canModelUrl, bank: true, active: false, paused: true, onReady: readyHandler('can'), onError: message => { loadingError.value = message } }),
            ]),
            h('div', {
              class: ['lab-model', { 'is-hovered': hovered.value }],
              style: { '--hover-angle': `${hoverAngle.value}deg` },
              onPointerenter: updateHover,
              onPointermove: updateHover,
              onPointerleave: resetHover,
              onPointercancel: resetHover,
            }, [
              h(LabProductModel, { source: glassModelUrl, active: true, paused: hovered.value, onReady: readyHandler('glass'), onError: message => { loadingError.value = message } }),
            ]),
          ]),
        ]),
        ]),
      ]),
    })
    app.mount('#app')
    window.addEventListener('resize', updateViewport)
    window.addEventListener('pagehide', () => {
      window.removeEventListener('resize', updateViewport)
      app.unmount()
    }, { once: true })
  </script>
</body>
</html>
