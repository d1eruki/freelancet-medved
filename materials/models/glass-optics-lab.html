<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стакан — сцена слайдера</title>
  <style>
    html, body, #app { width: 100%; height: 100%; margin: 0; }
    body { overflow: auto; }
    .lab-scene {
      position: relative;
      isolation: isolate;
      width: var(--scene-width);
      height: var(--scene-height);
      overflow: hidden;
      background: #fff;
    }
    .lab-counter {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      width: 100%;
      height: 30%;
      object-fit: fill;
      pointer-events: none;
    }
    .lab-pattern {
      position: absolute;
      inset: 0 0 30%;
      z-index: 1;
      width: 100%;
      height: 70%;
      color: #3d5a45;
      opacity: 0.07;
      pointer-events: none;
    }
    /* Резервируем ту же геометрию верхней части и управления слайдера. */
    .lab-stage {
      position: absolute;
      inset: calc((6rem + clamp(1.75rem, 5vw, 4.5rem) + 2rem) * var(--zoom)) 0 calc(6.5rem * var(--zoom));
      z-index: 2;
    }
    .lab-product-scene {
      --product-model-height: min(91.666667%, calc(36rem * var(--zoom)));
      --product-model-bottom: calc(0.75rem * var(--zoom));
      --product-can-offset: calc(8rem * var(--zoom));
      --product-can-bottom: calc(5rem * var(--zoom));
    }
    .lab-zoom {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 10;
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 1px solid #3d5a45;
      border-radius: 0.75rem;
      background: #fff;
      color: #3d5a45;
      font: 16px system-ui, sans-serif;
    }
    .lab-zoom select {
      min-height: 44px;
      max-width: 10rem;
      padding: 0.5rem;
      border-radius: 0.5rem;
      color: inherit;
      background: #fff;
      font: inherit;
    }
    .lab-zoom button {
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .lab-zoom button:hover:not(:disabled) { background: #efefef; }
    .lab-zoom button:focus-visible { outline: 2px solid #3d5a45; outline-offset: -2px; }
    .lab-zoom button:disabled { cursor: default; }
    @media (min-width: 80rem) {
      .lab-stage { top: calc((7rem + clamp(1.75rem, 5vw, 4.5rem) + 2.5rem) * var(--zoom)); }
    }
    @media (max-width: 53.999rem) {
      .lab-stage { top: calc(1rem * var(--zoom)); bottom: calc(2rem * var(--zoom)); }
      .lab-product-scene { --product-model-height: min(calc(var(--scene-height) * 0.85), var(--scene-width)); --product-model-bottom: 0px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { createApp, h, nextTick, ref } from 'vue'
    import '../../src/styles/main.css'
    import CategoryPattern from '../../src/components/CategoryPattern.vue'
    import ProductScene from '../../src/components/home/ProductScene.vue'
    import barCounterTexture from '../../src/assets/home/bar-counter-texture.png'
    import { drinkPresets } from '../../src/data/drink-presets.js'

    const drink = ref('cider')
    const foam = ref(true)
    const zoom = ref(1)
    const viewport = ref({ width: window.innerWidth, height: window.innerHeight })
    const updateViewport = () => {
      viewport.value = { width: window.innerWidth, height: window.innerHeight }
    }
    async function setZoom(value) {
      zoom.value = Math.max(0.5, Math.min(4, value))
      if (zoom.value === 1) {
        await nextTick()
        window.scrollTo(0, 0)
      }
    }
    const app = createApp({
      render: () => h('div', [
        h('div', { class: 'lab-zoom', role: 'group', 'aria-label': 'Настройки сцены' }, [
          h('select', { 'aria-label': 'Напиток', value: drink.value, onChange: event => { drink.value = event.target.value } },
            Object.entries(drinkPresets).map(([value, preset]) => h('option', { value }, preset.label))),
          drinkPresets[drink.value].foamAllowed && h('button', { type: 'button', 'aria-pressed': foam.value, onClick: () => { foam.value = !foam.value } }, 'Пена'),
          h('button', { type: 'button', 'aria-label': 'Уменьшить масштаб', disabled: zoom.value <= 0.5, onClick: () => setZoom(zoom.value - 0.25) }, '−'),
          h('button', { type: 'button', 'aria-label': 'Сбросить масштаб до 100%', onClick: () => setZoom(1) }, `${Math.round(zoom.value * 100)}%`),
          h('button', { type: 'button', 'aria-label': 'Увеличить масштаб', disabled: zoom.value >= 4, onClick: () => setZoom(zoom.value + 0.25) }, '+'),
        ]),
        h('section', {
          class: 'lab-scene', 'aria-label': 'Стакан на стойке',
          style: {
            '--zoom': zoom.value,
            '--scene-width': `${viewport.value.width * zoom.value}px`,
            '--scene-height': `${viewport.value.height * zoom.value}px`,
          },
        }, [
        h('img', { class: 'lab-counter', 'data-product-counter': '', src: barCounterTexture, alt: '', 'aria-hidden': 'true' }),
        h(CategoryPattern, { class: 'lab-pattern', 'data-product-pattern': 'sidr', slug: 'sidr', idPrefix: 'glass-lab', viewBox: `0 0 ${viewport.value.width} ${viewport.value.height * 0.7}` }),
        h('div', { class: 'lab-stage' }, [
          h(ProductScene, { active: true, drink: drink.value, foam: foam.value, patternSlug: 'sidr', class: 'lab-product-scene' }),
        ]),
        ]),
      ]),
    })
    app.mount('#app')
    window.addEventListener('resize', updateViewport)
    window.addEventListener('pagehide', () => {
      window.removeEventListener('resize', updateViewport)
      app.unmount()
    }, { once: true })
  </script>
</body>
</html>
