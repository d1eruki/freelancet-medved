name: Lighthouse site audit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Site environment to audit
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      environment:
        description: Site environment to audit
        type: string
        default: production

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  pages:
    name: Select published pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.routes.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Read route registry
        id: routes
        run: node scripts/check-lighthouse.mjs --list-pages

  audit:
    name: ${{ inputs.environment }} ${{ matrix.path }}, mobile and desktop
    needs: pages
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.pages.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install audit tools outside the project
        run: npm install --prefix "$RUNNER_TEMP/medved-lighthouse" --no-package-lock --no-audit --no-fund lighthouse@13.4.1
      - name: Locate Chrome
        run: |
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Audit published site sequentially
        env:
          SITE_ENV: ${{ inputs.environment }}
          LIGHTHOUSE_PAGE_PATH: ${{ matrix.path }}
          LIGHTHOUSE_MODULES: ${{ runner.temp }}/medved-lighthouse/node_modules
          LIGHTHOUSE_REPORTS: ${{ runner.temp }}/medved-lighthouse-${{ inputs.environment }}-reports/${{ matrix.id }}
        run: node scripts/check-lighthouse.mjs
      - name: Save HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ inputs.environment }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/medved-lighthouse-${{ inputs.environment }}-reports/${{ matrix.id }}
          retention-days: 14
          if-no-files-found: warn
