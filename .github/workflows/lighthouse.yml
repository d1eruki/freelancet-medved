name: Lighthouse site audit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Site environment to audit
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      environment:
        description: Site environment to audit
        type: string
        default: production

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  audit:
    name: Published ${{ inputs.environment }}, mobile and desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install audit tools outside the project
        run: npm install --prefix "$RUNNER_TEMP/medved-lighthouse" --no-package-lock --no-audit --no-fund lighthouse@13.4.1
      - name: Locate Chrome
        run: |
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Audit published site sequentially
        env:
          SITE_ENV: ${{ inputs.environment }}
          LIGHTHOUSE_MODULES: ${{ runner.temp }}/medved-lighthouse/node_modules
          LIGHTHOUSE_REPORTS: ${{ runner.temp }}/medved-lighthouse-${{ inputs.environment }}-reports
        run: node scripts/check-lighthouse.mjs
      - name: Save HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/medved-lighthouse-${{ inputs.environment }}-reports
          retention-days: 14
          if-no-files-found: warn
